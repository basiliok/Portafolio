<a class="publicacion" [href]="link" target="_blank">
    <div class="publicacion_portada">
        <img class="img_portada" [src]="image" [alt]="title" />
        <img class="icon_devto" src="assets/publicaciones/dev-to.png" alt="dev.to" />
        <div class="panel_portada"></div>
    </div>
    <div>
        <div class="titulo">{{ title }}</div>
        <div class="detalle">{{ first_detail }}</div>
        <div class="detalle">{{ second_detail }}</div>
    </div>
</a>
