<a class="publicacion" [href]="link" target="_blank">
    <img class="publicacion_portada" [src]="image" [alt]="title" />
    <div>
        <div class="titulo">{{ title }}</div>
        <div class="detalle">{{ first_detail }}</div>
        <div class="detalle">{{ second_detail }}</div>
    </div>
</a>
